[project]
name = "modal-jobs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Thomas J. Fan", email = "thomasjpfan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["click>=8.5.0", "modal>=1.6.1", "rich>=15.0.0"]

[project.scripts]
modal-jobs = "modal_jobs._cli:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.poe.tasks]
lint = "ruff check ."
test = "pytest"
format = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]
check = [{ cmd = "ruff format --check ." }, { ref = "lint" }, { ref = "test" }]
